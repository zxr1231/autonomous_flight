use_fake_detector: true
takeoff_height: 1.0 # m
desired_velocity: 1.0 # m/s
desired_acceleration: 1.0 # m/s^2
desired_angular_velocity: 0.5 # rad/s
waypoint_stablize_time: 0.0
initial_scan: false
record_rosbag: false # set true only when an exploration dataset is needed
return_home_on_complete: true
# Operational near-completion threshold, not a ground-truth coverage percentage.
# Both selected path gain and every reachable node's best-yaw gain must be <= this value.
completion_gain_threshold: 500
completion_confirmations: 3
completion_confirm_duration: 5.0 # simulation seconds with fresh depth between checks
return_home_tolerance: 0.2 # m; return at takeoff altitude and hover, do not land
replan_time_for_dynamic_obstacles: 0.3
free_range: [1, 1, 1]
reach_goal_distance: 0.1
